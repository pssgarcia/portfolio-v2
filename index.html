<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pedro Soares — Full-Stack Developer specializing in Vue.js, Laravel, and scalable web applications. Based in Belo Horizonte, Brazil." />
    <meta name="theme-color" content="#1b1815" />
    <link rel="icon" href="/favicon.ico" />
    <title>Pedro Soares — Full-Stack Developer</title>
  </head>
  <body>
    <!--
      DIRECTION CONTRACT — Portfolio redesign, Direction C "Editorial / Dark"
      THESIS: A backend engineer's site that practises the restraint it preaches —
        substance carried by type and a dated ledger, not by cards, glow, or gradient.
        Refuses the dark-violet AI-portfolio template and the centered-hero cliché.
      OWN-WORLD: warm-dark stock (#1B1815) / bone text / one flat brass accent
        (#C99B57, structural only). Bricolage Grotesque 800 display · Spectral serif
        body · Spline Sans Mono for dates, indices, labels. Hairline rules, no cards,
        no shadows. [data-theme="light"] carries the Direction A warm-paper palette.
      STORY: a hiring reader grasps Pedro's level, stack, and real production work in
        under a minute, then reaches out. Experience is the anchor; projects are ranked.
      FIRST VIEWPORT: left-anchored. Mono kicker (accent) → "Pedro Soares" at display
        scale → one real positioning line with "built to scale" in accent italic →
        ruled mono meta row (location · degree · current role). No image, no buttons.
      FORM: editorial ledger. Running section index (NN · LABEL) above each heading,
        aligned to the page's left edge. Experience = dated ledger (year ranges in the
        margin). Projects = 2-up numbered ledger. Comp: .impeccable/mocks/decision/directions.html #comp-c
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish
        review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
    -->
    <!-- Netlify forms workaround for Vue SPA -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>

    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
