<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pedro Soares, engenheiro de software com foco em backend e sistemas. PHP, Laravel e SaaS multi-tenant, em Belo Horizonte, Brasil." />
    <meta name="theme-color" content="#1b1815" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <title>Pedro Soares · Engenheiro de Software</title>
  </head>
  <body>
    <!--
      DIRECTION CONTRACT. Portfolio redesign, Direction C "Editorial / Dark"
      THESIS: A backend engineer's site that practises the restraint it preaches.
        Substance carried by type and a timeline, not by cards, glow, or gradient.
        Refuses the dark-violet AI-portfolio template and the centered-hero cliché.
      OWN-WORLD: warm-dark stock (#1B1815), bone text, one flat brass accent
        (#C99B57, structural only). Bricolage Grotesque 800 display, Newsreader serif
        body, Spline Sans Mono for dates, labels. Hairline rules, no cards,
        no shadows. [data-theme="light"] carries the Direction A warm-paper palette.
      STORY: a hiring reader grasps Pedro's level, stack, and real production work in
        under a minute, then reaches out. Projects and Experience both read as timelines.
      FIRST VIEWPORT: left-anchored. Mono accent kicker, then "Pedro Soares" at display
        scale, then one real positioning line with "Built to scale" in accent italic.
        No meta row, no image, no buttons.
      FORM: editorial timeline. Section headings sit directly on the left edge (no
        running index line). Both Projects and Experience are vertical timelines
        (accent rail + node dots), newest to oldest; Projects carry a year, techs,
        repo/demo links, and a landing screenshot for the recent ones (the 3 newest
        show, the rest behind "show older"); Experience carries Work/Education chips
        (client-pinned). Section order: About, Projects, Experience, Contact.
        Comp: .impeccable/mocks/decision/directions.html #comp-c
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish
        review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
    -->
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
